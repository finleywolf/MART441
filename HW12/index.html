# HTML5 Canvas Mini-Game Prototype

```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Mini-Game</title>

  <style>
    body {
      background: #1a1a1a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 20px;
    }

    canvas {
      border: 4px solid white;
      background: #222;
      display: block;
      margin: 20px auto;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      margin-bottom: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Catch the Bouncing Blob</h1>
  <p>Use WASD or the arrow keys to move the blue square.</p>

  <button id="musicButton">Play Music</button>

  <audio id="bgMusic" controls loop>
    <source src="music.wav" type="audio/wav">
    Your browser does not support audio.
  </audio>

  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let backgroundColor = "#222";
    let flashTimer = 0;

    class GameObject {
      constructor(x, y, width, height, color, speedX = 0, speedY = 0) {
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;
        this.baseWidth = width;
        this.baseHeight = height;
        this.color = color;
        this.speedX = speedX;
        this.speedY = speedY;
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
      }

      keepInBounds() {
        if (this.x < 0) this.x = 0;
        if (this.y < 0) this.y = 0;

        if (this.x + this.width > canvas.width) {
          this.x = canvas.width - this.width;
        }

        if (this.y + this.height > canvas.height) {
          this.y = canvas.height - this.height;
        }
      }
    }

    const player = new GameObject(100, 100, 50, 50, "deepskyblue");
    const enemy = new GameObject(500, 300, 60, 60, "hotpink", 4, 3);

    const keys = {};

    document.addEventListener("keydown", (event) => {
      keys[event.key.toLowerCase()] = true;
    });

    document.addEventListener("keyup", (event) => {
      keys[event.key.toLowerCase()] = false;
    });

    function movePlayer() {
      const speed = 5;

      if (keys["w"] || keys["arrowup"]) {
        player.y -= speed;
      }
      if (keys["s"] || keys["arrowdown"]) {
        player.y += speed;
      }
      if (keys["a"] || keys["arrowleft"]) {
        player.x -= speed;
      }
      if (keys["d"] || keys["arrowright"]) {
        player.x += speed;
      }

      player.keepInBounds();
    }

    function moveEnemy() {
      enemy.x += enemy.speedX;
      enemy.y += enemy.speedY;

      if (enemy.x <= 0 || enemy.x + enemy.width >= canvas.width) {
        enemy.speedX *= -1;
      }

      if (enemy.y <= 0 || enemy.y + enemy.height >= canvas.height) {
        enemy.speedY *= -1;
      }
    }

    function hasCollided(obj1, obj2) {
      return (
        obj1.x < obj2.x + obj2.width &&
        obj1.x + obj1.width > obj2.x &&
        obj1.y < obj2.y + obj2.height &&
        obj1.y + obj1.height > obj2.y
      );
    }

    function handleCollision() {
      backgroundColor = "darkred";
      flashTimer = 10;

      player.width = player.baseWidth + 20;
      player.height = player.baseHeight + 20;

      enemy.width = enemy.baseWidth + 20;
      enemy.height = enemy.baseHeight + 20;
    }

    function resetSizes() {
      player.width = player.baseWidth;
      player.height = player.baseHeight;

      enemy.width = enemy.baseWidth;
      enemy.height = enemy.baseHeight;
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (flashTimer > 0) {
        flashTimer--;
      } else {
        backgroundColor = "#222";
        resetSizes();
      }

      ctx.fillStyle = backgroundColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      movePlayer();
      moveEnemy();

      if (hasCollided(player, enemy)) {
        handleCollision();
      }

      player.draw();
      enemy.draw();

      requestAnimationFrame(update);
    }

    update();

    const musicButton = document.getElementById("musicButton");
    const bgMusic = document.getElementById("bgMusic");

    musicButton.addEventListener("click", () => {
      bgMusic.play();
    });
  </script>

</body>
</html>
